[project]
name = "detonate-mcp"
version = "0.1.0"
description = "MCP server: run unknown binaries in a maximum-hardening container (the safety profile is enforced server-side and cannot be parameterized away)"
requires-python = ">=3.11"
dependencies = ["mcp[cli]>=1.2.0"]

[project.scripts]
detonate-mcp = "detonate_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/detonate_mcp"]

[tool.pytest.ini_options]

[dependency-groups]
dev = ["ruff>=0.8", "pytest>=8", "pyright>=1.1"]
testpaths = ["tests"]
